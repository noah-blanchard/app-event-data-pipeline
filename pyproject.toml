[project]
name = "app-event-data-pipeline"
version = "0.1.0"
description = "Batch data pipeline for mobile app usage events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6,<4",
    "pyspark>=4.1.3,<4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
# Let tests import top-level folders such as `generator`.
pythonpath = ["."]
