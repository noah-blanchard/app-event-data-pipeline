name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Spark runs on the JVM: pin the same Java version as the Dockerfile.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-uv publishes no moving major tag (v10), only exact versions.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # Installs Python from .python-version and the exact versions from uv.lock;
      # fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v
