services:
  pipeline:
    build: .
    # Share the project folder with the container: code edits are seen
    # immediately, and generated data lands back in ./data on the host.
    volumes:
      - .:/app
    ports:
      - "4040:4040" # Spark UI
    # Inside the compose network, a service is reachable by its name.
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    # Wait until PostgreSQL accepts connections, not just until it starts.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    # Compose fills ${...} from .env; the value after :- is the default.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    # Named volume managed by Docker: data survives container restarts.
    # Since PostgreSQL 18 the image stores data under
    # /var/lib/postgresql/18/docker, so mount the parent folder.
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432" # for GUI clients on the host (DBeaver, pgAdmin)
    healthcheck:
      # $$ escapes $ so the variable is read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
